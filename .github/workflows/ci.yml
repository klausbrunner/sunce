name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, rustfmt
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Check formatting (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt -- --check

      - name: Run clippy (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests without default features (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --no-default-features --features cli --verbose

      - name: Run clippy without default features (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --no-default-features --features cli --all-targets -- -D warnings

      - name: Test the library without native adapters (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --locked --no-default-features
          cargo clippy --no-default-features --all-targets -- -D warnings

  wasm:
    name: WebAssembly library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust with the WebAssembly target
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the library without native adapters
        run: cargo check --locked --lib --no-default-features --target wasm32-unknown-unknown
