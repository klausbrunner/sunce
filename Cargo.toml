[package]
name = "sunce"
version = "0.5.1"
edition = "2024"
rust-version = "1.98.1"
description = "Streaming solar position and event calculations with a scripting-friendly CLI"
license = "MIT"
repository = "https://github.com/klausbrunner/sunce"
homepage = "https://github.com/klausbrunner/sunce"
documentation = "https://github.com/klausbrunner/sunce"
readme = "README.md"
authors = ["Klaus Brunner <klaus.brunner@gmail.com>"]
keywords = ["solar", "sun", "astronomy", "sunrise", "sunset"]
categories = ["command-line-utilities", "science"]
include = [
    "src/**/*",
    "tests/**/*",
    "examples/**/*",
    "docs/**/*",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE"
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
solar-positioning = "0.7.2"
arrow-array = { version = "60", default-features = false, optional = true }
arrow-schema = { version = "60", default-features = false, optional = true }
parquet = { version = "60", features = ["arrow", "snap"], default-features = false, optional = true }
iana-time-zone = { version = "0.1", optional = true }
serde = "1"
serde_json = "1"
ahash = { version = "0.8", default-features = false, features = ["std"] }

[features]
default = ["cli", "parquet"]
cli = ["chrono/clock", "dep:iana-time-zone", "ahash/runtime-rng"]
parquet = ["dep:arrow-array", "dep:arrow-schema", "dep:parquet"]

[[bin]]
name = "sunce"
path = "src/main.rs"
required-features = ["cli"]

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
bytes = "1.12"
csv = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Optimize most dependencies for size with some speed consideration
[profile.release.package."*"]
opt-level = "s"
strip = true

# Keep performance-critical crates optimized for speed
[profile.release.package.solar-positioning]
opt-level = 3
[profile.release.package.chrono]
opt-level = 3
[profile.release.package.chrono-tz]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
